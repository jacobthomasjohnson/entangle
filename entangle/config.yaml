name: Entangle
version: "0.3.2"
slug: entangle
description: Read-only Home Assistant explorer with an isolated editable sandbox
arch:
  - amd64
url: https://github.com/jacobthomasjohnson/entangle
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:graph-outline
panel_title: Entangle
panel_admin: true
homeassistant_api: true
environment:
  ENTANGLE_INGRESS_ONLY: "true"
map:
  - type: homeassistant_config
    read_only: true
    path: /homeassistant
options: {}
schema: {}
